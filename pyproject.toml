[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ots-browser"
version = "1.0.0"
description = "OTS Configuration Browser - A Python TUI for browsing OTS configuration data"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Mu2e Experiment"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "diskcache>=5.6.0",
    "pymongo>=4.5.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "textual-dev>=1.0.0",
    "radon>=5.1.0",
    "coverage>=7.0.0",
]

[project.scripts]
ots-browser = "artdaqdb_browser.__main__:main"
coverage-analyzer = "coverage_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"
filterwarnings = [
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
    "ignore:coroutine 'DatabaseSelectorMixin._fetch_databases' was never awaited:RuntimeWarning",
    "ignore:coroutine 'RestoreScreen._run_restore' was never awaited:RuntimeWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/artdaqdb_browser"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage_analyzer]
source = ["src/artdaqdb_browser"]
tests = ["tests"]
exclude = ["**/migrations/*", "**/__pycache__/*", "**/test_*.py"]
threshold = 80
output_dir = "coverage_reports"

[tool.coverage_analyzer.priorities]
public_api_weight = 2.0
complexity_weight = 1.5
textual_handlers_weight = 2.5
untested_bonus = 50

[tool.coverage_analyzer.textual]
handler_patterns = ["on_*", "action_*", "watch_*"]
lifecycle_methods = ["compose", "on_mount", "on_ready", "on_show"]
