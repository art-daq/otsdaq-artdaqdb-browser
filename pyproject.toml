[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artdaqdb-browser"
version = "1.0.0"
description = "OTSDAQ Configuration Browser - A Python TUI for browsing OTSDAQ configuration data"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Mu2e Experiment"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "diskcache>=5.6.0",
    "pymongo>=4.5.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "textual-dev>=1.0.0",
    "radon>=5.1.0",
    "coverage>=7.0.0",
]

[project.scripts]
artdaqdb-browser = "artdaqdb_browser.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

